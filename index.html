<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a2440">
<title>猫ポモドーロ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{
    --glass: rgba(30,24,52,.42);
    --glass-line: rgba(255,255,255,.18);
    --text: #fff8ef;
    --accent: #ffc58a;
    --rest: #9fe0c8;
    --kitchen: #ffd36e;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#1d1830;color:var(--text);
    font-family:"M PLUS Rounded 1c",system-ui,sans-serif;user-select:none}

  /* 背景(2枚を重ねてクロスフェード) */
  .bg{position:fixed;inset:0;background-size:cover;background-position:center;
    transition:opacity 1.6s ease}
  .bg.hidden{opacity:0}

  /* 時間帯ごとの仮背景(画像が揃うまで) */
  .ph-morning  {background:linear-gradient(160deg,#f7c9a8,#c9b7e6 60%,#8e86c9)}
  .ph-afternoon{background:linear-gradient(160deg,#9fd3f2,#d9ecf7 55%,#f3e2c4)}
  .ph-night    {background:linear-gradient(160deg,#5b4a8c,#c08fb4 60%,#f1b98f)}
  .ph-midnight {background:linear-gradient(160deg,#141433,#28285a 60%,#3d3470)}

  /* 雨(雨用の画像がない間の演出) */
  #rain{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 2s}
  #rain.on{opacity:.55}

  .chip{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);border-radius:999px;padding:6px 14px;font-size:14px;
    text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .icon-btn{border:none;cursor:pointer;color:var(--text);font:inherit}
  .btn{border:1px solid var(--glass-line);background:rgba(255,255,255,.12);color:var(--text);
    font:inherit;font-size:15px;padding:8px 16px;border-radius:999px;cursor:pointer;min-width:64px}
  .btn.main{background:var(--accent);color:#3a2a1a;border-color:transparent;font-weight:800;min-width:96px}
  .btn:active{transform:scale(.96)}

  /* 押したときに少し縮む(押せるボタン全部) */
  .btn,.k-btn,.k-preset,.k-pill,.icon-btn,.stepper button,.snd-list button,.toggle{
    transition:transform 160ms var(--ease-out)}
  .icon-btn:active,.stepper button:active,.snd-list button:active,.toggle:active{transform:scale(.95)}

  /* ===================== ポモドーロ(横画面) ===================== */
  .ui{position:fixed;inset:0;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right))
      max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
      display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
  .ui > *{pointer-events:auto}
  .top{display:flex;justify-content:flex-end;align-items:flex-start;gap:12px}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}

  /* 右上の現在時刻(枠なしで大きく) */
  .clockbox{text-align:right}
  .clock-big{font-size:clamp(34px,min(6.5vw,17vh),84px);font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.55)}
  .clock-big small{font-size:.38em;margin-right:.25em;opacity:.85}
  #kClock small{font-size:.8em;margin-right:.2em;opacity:.85}
  .date{font-size:clamp(11px,3vh,15px);opacity:.85;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .chips{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px}
  /* 右上の文字が背景に負けないように、右上だけ薄く暗くする */
  #scrim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(200deg,rgba(18,12,34,.55),transparent 35%)}
  body.mode-kitchen #scrim{display:none}

  /* 集中の枠:すりガラス。下に向かって少し濃くなる */
  .timer{background:linear-gradient(180deg,rgba(30,24,52,.42) 0%,rgba(30,24,52,.5) 45%,rgba(22,16,40,.78) 100%);
    border:1px solid var(--glass-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;
    padding:10px 18px 14px;text-align:center;flex:none}
  .phase-row{display:flex;justify-content:center;align-items:baseline;gap:8px}
  .phase{font-size:13px;letter-spacing:.15em;color:var(--accent)}
  .phase.rest{color:var(--rest)}
  .cycle{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
  .time{font-size:clamp(46px,min(7vw,17vh),96px);font-weight:800;line-height:1.05;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.35)}
  .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;margin:6px 0 10px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s linear}
  .bar i.rest{background:var(--rest)}
  .bar i.kitchen{background:var(--kitchen)}
  .btns{display:flex;gap:8px;justify-content:center}
  .btns .btn{white-space:nowrap}

  /* 吹き出し */
  .speech{max-width:min(420px,42vw);background:rgba(255,250,242,.92);
    color:#4a3a3a;border-radius:18px;padding:10px 18px;font-size:clamp(14px,3.6vh,18px);
    line-height:1.5;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.25);min-height:2.6em;
    cursor:pointer}
  .speech .name{font-size:11px;color:#b07a5a;font-weight:800;display:block}
  .speech{display:flex;align-items:center;gap:12px;padding-left:10px}
  .speech .avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;
    border:2px solid #f3d7b8;box-shadow:0 2px 6px rgba(0,0,0,.2)}

  /* ===================== キッチン(縦画面) ===================== */
  #kitchen{position:fixed;inset:0;display:none;flex-direction:column;gap:12px;
    padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
  body.mode-kitchen .ui{display:none}
  body.mode-kitchen #kitchen{display:flex}
  /* 縦画面では背景の絵を猫の位置に寄せて、少しぼかして暗くする */
  body.mode-kitchen .bg{background-position:62% center;filter:blur(2px) brightness(.62);transform:scale(1.04)}

  .k-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .k-card{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border-radius:24px;padding:14px 18px 16px;text-align:center}
  .k-label{font-size:15px;color:var(--kitchen);min-height:1.4em}
  .k-time{font-size:clamp(72px,24vw,128px);font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;text-shadow:0 3px 14px rgba(0,0,0,.4)}
  .k-row{display:flex;gap:10px;justify-content:center}
  .k-row + .k-row{margin-top:10px}
  .k-btn{flex:1;border:1px solid var(--glass-line);background:rgba(255,255,255,.14);color:var(--text);
    font:inherit;font-size:18px;font-weight:800;padding:14px 8px;border-radius:18px;cursor:pointer}
  .k-btn.main{background:var(--kitchen);color:#3a2a10;border-color:transparent}
  .k-btn:active{transform:scale(.96)}

  .k-presets{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;
    gap:10px;align-content:start;padding-bottom:4px}
  .k-preset{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--glass-line);
    background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text);
    font:inherit;padding:12px;border-radius:16px;cursor:pointer;min-height:64px}
  .k-preset:active{transform:scale(.97)}
  .k-preset.active{border-color:var(--kitchen);box-shadow:0 0 0 2px var(--kitchen) inset}
  .k-preset .emo{font-size:28px;line-height:1}
  .k-preset .nm{font-size:14px;font-weight:800;display:block}
  .k-preset .mn{font-size:12px;opacity:.85}

  /* すぐ計る(なんでも用の丸ボタン) */
  .k-quick{display:flex;align-items:center;gap:8px;overflow-x:auto;flex:none}
  .k-quick .lbl{font-size:13px;white-space:nowrap;margin-right:2px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .k-pill{flex:none;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);color:var(--text);font:inherit;font-size:16px;font-weight:800;
    padding:10px 24px;border-radius:999px;cursor:pointer}
  .k-pill:active{transform:scale(.96)}
  .k-pill.active{border-color:var(--kitchen);box-shadow:0 0 0 2px var(--kitchen) inset}

  .k-speech{max-width:none;align-self:stretch}
  .k-speech::after{display:none}

  /* ゆであがり画面 */
  #kring{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;padding:24px;background:rgba(40,26,10,.72);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center}
  #kring.open{display:flex;animation:fadeIn 200ms ease-out}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes pop{from{transform:scale(.85)}}
  #kring .big{font-size:clamp(30px,9vw,48px);font-weight:800;color:var(--kitchen);animation:pulse 1s ease-in-out infinite}
  #kring .sub{font-size:16px;opacity:.9}
  #kring .ring-cat{width:clamp(120px,36vw,170px);height:clamp(120px,36vw,170px);border-radius:50%;object-fit:cover;
    border:4px solid var(--kitchen);box-shadow:0 0 0 8px rgba(255,211,110,.18),0 8px 24px rgba(0,0,0,.35);
    animation:pop 400ms cubic-bezier(0.34,1.56,0.64,1),hop .9s ease-in-out 400ms infinite}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(-4deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-7px) rotate(4deg)}}
  #kring .k-row{width:min(420px,100%)}
  #kring .stop{flex:none;width:min(420px,100%);font-size:24px;padding:22px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  /* 設定パネル */
  /* 開くときは220msでふわっと、閉じるときは150msで素早く */
  .sheet{position:fixed;inset:0;background:rgba(10,8,20,.5);display:flex;align-items:center;justify-content:center;z-index:10;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity 150ms ease-out,visibility 0s linear 150ms}
  .sheet.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 220ms var(--ease-out),visibility 0s}
  .sheet .card{background:#2b2442;border:1px solid var(--glass-line);border-radius:20px;padding:18px 22px;width:min(420px,92vw);
    max-height:92vh;overflow-y:auto;transform:scale(.96);transition:transform 150ms ease-out}
  .sheet.open .card{transform:none;transition:transform 220ms var(--ease-out)}
  .sheet .sec{font-size:13px;color:var(--accent);letter-spacing:.08em;margin:14px 0 2px;padding-top:12px;
    border-top:1px solid var(--glass-line)}
  .sheet h2 + .sec{border-top:none;padding-top:0;margin-top:4px}
  .snd{margin:12px 0;font-size:15px}
  .snd-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .snd-list button{border:1px solid var(--glass-line);background:rgba(255,255,255,.08);color:var(--text);
    font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
  .snd-list button.on{background:var(--accent);color:#3a2a1a;border-color:transparent;font-weight:800}
  .snd-note{font-size:12px;opacity:.7}
  .sheet h2{font-size:16px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:15px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-line);
    background:rgba(255,255,255,.1);color:var(--text);font-size:18px;cursor:pointer}
  .stepper b{min-width:3.2em;text-align:center}
  .toggle{border:1px solid var(--glass-line);background:rgba(255,255,255,.08);color:var(--text);
    font:inherit;font-size:14px;padding:6px 18px;border-radius:999px;cursor:pointer;min-width:4.2em}
  .toggle.on{background:var(--accent);color:#3a2a1a;border-color:transparent;font-weight:800}
  .sheet .close{margin-top:12px;width:100%}

  /* 向きのお願い(ポモドーロは横、キッチンは縦) */
  #rotate{position:fixed;inset:0;background:#1d1830;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;z-index:20;text-align:center;padding:24px}
  #rotate .phone{font-size:48px;animation:tilt 2s ease-in-out infinite}
  body.mode-kitchen #rotate .phone{animation-name:tiltBack}
  #rotate .switch{margin-top:8px}
  @keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @keyframes tiltBack{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
  @media (orientation:portrait){ body:not(.mode-kitchen) #rotate{display:flex} }
  @media (orientation:landscape) and (max-height:540px){ body.mode-kitchen #rotate{display:flex} }

  /* 🍅の数が増えたとき1回だけ弾む */
  #count.bump{animation:bump 300ms var(--ease-out)}
  @keyframes bump{50%{transform:scale(1.15)}}

  /* ===== PC(マウス操作の端末):回転のお願いは出さず、キッチンは中央の縦長カードに ===== */
  @media (hover:hover) and (pointer:fine){
    #rotate{display:none !important}
    body.mode-kitchen #kitchen{left:0;right:0;margin:0 auto;width:min(440px,100%);top:20px;bottom:20px;
      border-radius:28px;background:rgba(24,18,44,.28);border:1px solid var(--glass-line);
      box-shadow:0 12px 40px rgba(0,0,0,.35);padding:16px 16px 14px}
    body.mode-kitchen .bg{background-position:center;filter:blur(6px) brightness(.6);transform:scale(1.06)}
    .k-time{font-size:clamp(72px,24vw,112px)}
  }

  /* 端末で「視差効果を減らす」がオンなら、動きを止めてフェードだけにする */
  @media (prefers-reduced-motion:reduce){
    #count.bump,#kring .ring-cat,#kring .big,#rotate .phone{animation:none}
    .sheet .card,.sheet.open .card{transform:none;transition:none}
    .bar i{transition:none}
  }
</style>
</head>
<body>
  <div class="bg" id="bgA"></div>
  <div class="bg hidden" id="bgB"></div>
  <canvas id="rain"></canvas>

  <!-- ポモドーロ(横) -->
  <div id="scrim"></div>
  <div class="ui">
    <div class="top">
      <div class="clockbox">
        <div class="clock-big" id="clock">--:--</div>
        <div class="date" id="date"></div>
        <div class="chips">
          <div class="chip" id="count">🍅 0</div>
          <button class="chip icon-btn" data-mode="kitchen" aria-label="キッチンモード">🍳 キッチン</button>
          <button class="chip icon-btn" id="settingsBtn" aria-label="設定">⚙</button>
        </div>
      </div>
    </div>
    <div class="bottom">
      <div class="timer">
        <div class="phase-row"><span class="phase" id="phase">しゅうちゅう</span><span class="cycle" id="cycle">1/4</span></div>
        <div class="time" id="time">25:00</div>
        <div class="bar"><i id="bar"></i></div>
        <div class="btns">
          <button class="btn main" id="startBtn">はじめる</button>
          <button class="btn" id="resetBtn">リセット</button>
        </div>
      </div>
      <div class="speech" id="speech"><img class="avatar" src="img/cat-icon.webp" alt=""><div><span class="name">ねこ</span><span class="say"></span></div></div>
    </div>
  </div>

  <!-- キッチン(縦) -->
  <div id="kitchen">
    <div class="k-top">
      <div class="chip" id="kClock">--:--</div>
      <div style="display:flex;gap:8px">
        <button class="chip icon-btn" data-mode="pomodoro" aria-label="ポモドーロモード">🍅 ポモドーロ</button>
        <button class="chip icon-btn" id="kSettingsBtn" aria-label="設定">⚙</button>
      </div>
    </div>
    <div class="k-card">
      <div class="k-label" id="kLabel">ゆでるものをえらんでね</div>
      <div class="k-time" id="kTime">00:00</div>
      <div class="bar"><i id="kBar" class="kitchen"></i></div>
      <div class="k-row">
        <button class="k-btn main" id="kStart">スタート</button>
        <button class="k-btn" id="kReset">リセット</button>
      </div>
      <div class="k-row">
        <button class="k-btn" data-add="30">+30秒</button>
        <button class="k-btn" data-add="60">+1分</button>
      </div>
    </div>
    <div class="k-quick" id="kQuick"><span class="lbl">⏱ すぐ計る</span></div>
    <div class="k-presets" id="kPresets"></div>
    <div class="speech k-speech" id="kSpeech"><img class="avatar" src="img/cat-icon.webp" alt=""><div><span class="name">ねこ</span><span class="say"></span></div></div>
  </div>

  <div id="kring">
    <img class="ring-cat" src="img/cat-icon.webp" alt="">
    <div class="big" id="kringBig">ゆであがったにゃ!</div>
    <div class="sub" id="kringSub"></div>
    <button class="k-btn main stop" id="kStop">とめる</button>
    <div class="k-row">
      <button class="k-btn" data-add="30">あと30秒</button>
      <button class="k-btn" data-add="60">あと1分</button>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="card">
      <h2>せってい</h2>
      <h3 class="sec">🍅 ポモドーロ</h3>
      <div class="row"><span>集中</span><div class="stepper"><button data-k="focus" data-d="-5">−</button><b id="focusVal">25分</b><button data-k="focus" data-d="5">+</button></div></div>
      <div class="row"><span>休憩</span><div class="stepper"><button data-k="rest" data-d="-1">−</button><b id="restVal">5分</b><button data-k="rest" data-d="1">+</button></div></div>
      <div class="row"><span>くり返す回数</span><div class="stepper"><button data-k="repeat" data-d="-1">−</button><b id="repeatVal">4回</b><button data-k="repeat" data-d="1">+</button></div></div>
      <div class="row"><span>長い休憩</span><div class="stepper"><button data-k="longRest" data-d="-5">−</button><b id="longRestVal">15分</b><button data-k="longRest" data-d="5">+</button></div></div>
      <div class="row"><span>自動で次の集中を始める</span><button class="toggle" id="autoNext">オフ</button></div>
      <h3 class="sec">🕰 表示</h3>
      <div class="row"><span>時刻の表示</span><div style="display:flex;gap:6px"><button class="toggle" data-clock="24">24時間</button><button class="toggle" data-clock="12">12時間</button></div></div>
      <h3 class="sec">🔔 音</h3>
      <div class="snd"><span>ポモドーロの音</span><div class="snd-list" data-snd="pomoSound"></div></div>
      <div class="snd"><span>キッチンの音</span><div class="snd-list" data-snd="kitchenSound"></div></div>
      <p class="snd-note">押すと試し聞きできるよ</p>
      <button class="btn close" id="closeSheet">とじる</button>
    </div>
  </div>

  <div id="rotate">
    <div class="phone">📱</div>
    <div id="rotateText">スマホを横にしてね</div>
    <button class="chip icon-btn switch" id="rotateSwitch"></button>
  </div>

<script>
/* =========================================================
   設定:背景画像
   1行 = 1枚。from時〜to時の手前まで表示される(to:22 なら 21:59 まで)。
   日をまたぐ場合は from:22, to:5 のように書けばOK。
   該当する絵がない時間帯は仮のグラデーション、
   雨の日に雨用の絵がなければ晴れの絵+雨の演出になる。
   ========================================================= */
// src を [ ] で複数書くと、その時間帯に入るたびにランダムで1枚選ばれる
const BG_SLOTS = [
  { weather: "sunny", from: 5,  to: 12, src: [                             // 5:00〜11:59(朝・ランダム)
    "img/sunny_morning1.webp", "img/sunny_morning2.webp", "img/sunny_morning3.webp",
    "img/sunny_morning4.webp", "img/sunny_morning5.webp", "img/sunny_morning6.webp",
  ] },
  { weather: "sunny", from: 12, to: 18, src: [                             // 12:00〜17:59(昼・ランダム)
    "img/sunny_afternoon1.webp", "img/sunny_afternoon2.webp", "img/sunny_afternoon3.webp", "img/sunny_afternoon4.webp",

function getPeriod(h){
  if (h >= 5  && h < 12) return "morning";    // 5:00〜11:59(朝の絵と合わせる)
  if (h >= 12 && h < 18) return "afternoon";
  if (h >= 18 && h < 22) return "night";     // 18:00〜21:59
  return "midnight";                          // 22:00〜4:59
}

// 複数枚の時間帯は、その時間帯に入ったときに1枚だけ選んで、時間帯が終わるまで同じ絵にする
const bgPick = new Map();
function findBg(weather, h){
  const hit = BG_SLOTS.find(s => s.weather === weather &&
    (s.from < s.to ? (h >= s.from && h < s.to) : (h >= s.from || h < s.to)));
  if (!hit) return null;
  if (!Array.isArray(hit.src)) return hit.src;
  if (!bgPick.has(hit)) bgPick.set(hit, hit.src[Math.floor(Math.random() * hit.src.length)]);
  for (const s of bgPick.keys()) if (s !== hit && s.weather === weather) bgPick.delete(s);   // 抜けた時間帯は次回また選び直す
  return bgPick.get(hit);
}

/* =========================================================
   タイマーの心臓部(ポモドーロとキッチンで共通)
   残り時間は「終了予定時刻」から毎回計算する。
   画面が消えたり裏に回っても、戻ったときに正しい残り時間になる。
   ========================================================= */
class Countdown {
  constructor(ms){ this.set(ms); }
  set(ms){ this.total = ms; this.remain = ms; this.running = false; this.endAt = 0; }
  left(){ return this.running ? Math.max(0, this.endAt - Date.now()) : this.remain; }
  start(){ if (this.remain <= 0) return false; this.endAt = Date.now() + this.remain; this.running = true; return true; }
  pause(){ this.remain = this.left(); this.running = false; }
  add(ms){ if (this.running) this.endAt += ms; else this.remain += ms; this.total = Math.max(this.total + ms, this.left()); }
  finished(){ return this.running && this.left() <= 0; }
  progress(){ return this.total > 0 ? 1 - this.left() / this.total : 0; }
}

function resizeRain(){

/* ===== 音とバイブ ===== */
let audioCtx = null;
function unlockAudio(){
  if (!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch{} }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, at, len, type = "sine", vol = .25){
  const t = audioCtx.currentTime + at;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + len);
  o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + len + .05);
}
/* ===== アラーム音の種類 =====
   録音ファイルは使わず、全部プログラムで鳴らしている(軽い)。
   増やしたいときは SOUNDS に1つ足して、SOUND_NAMES に名前を書く。 */
const SOUND_NAMES = { pororon: "ポロロン", pipi: "ピピピッ", bell: "チリン", nyan: "にゃーん" };
const SOUNDS = {
  // やさしいチャイム(down=true で下がるポロン)
  pororon(down){ (down ? [1175, 988] : [784, 988, 1175]).forEach((f, i) => tone(f, i * .22, .9)); },
  // 高めで離れていても聞こえるピピピッ
  pipi(){ [0, .16, .32].forEach(at => tone(1568, at, .13, "triangle", .45)); tone(2093, .52, .25, "triangle", .4); },
  // 風鈴っぽいチリンチリン(基音+少しの金属っぽい倍音)
  bell(){ [0, .3].forEach(at => { tone(2637, at, 1.3, "sine", .28); tone(2637 * 2.76, at, .35, "sine", .06); tone(3951, at, .6, "sine", .08); }); },
  // それっぽい「にゃーん」:音程を上げて下げる+声っぽいフィルター
  nyan(){
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), lfo = audioCtx.createOscillator(), lfoG = audioCtx.createGain();
    const f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(520, t);
    o.frequency.linearRampToValueAtTime(900, t + .2);
    o.frequency.linearRampToValueAtTime(820, t + .45);
    o.frequency.exponentialRampToValueAtTime(480, t + .85);
    lfo.frequency.value = 7; lfoG.gain.value = 14; lfo.connect(lfoG).connect(o.frequency);   // ゆらぎ
    f.type = "bandpass"; f.Q.value = 2.2;
    f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(1700, t + .25); f.frequency.linearRampToValueAtTime(1000, t + .85);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.55, t + .06);
    g.gain.setValueAtTime(.55, t + .55); g.gain.exponentialRampToValueAtTime(.001, t + .9);
    o.connect(f).connect(g).connect(audioCtx.destination);
    o.start(t); lfo.start(t); o.stop(t + .95); lfo.stop(t + .95);
  },
};
function playSound(name, opt){ if (audioCtx && SOUNDS[name]) SOUNDS[name](opt); }

   ========================================================= */
let phase = "focus";        // focus | rest | long(長い休憩)
let cycle = 1;              // 今が何回目の集中か
let lastMidLine = 0, saidLast = false;
const PHASE_KEY = { focus: "focus", rest: "rest", long: "longRest" };
const phaseTotal = () => settings[PHASE_KEY[phase]] * 60 * 1000;
const pomo = new Countdown(phaseTotal());
const el = {
  time: document.getElementById("time"), phase: document.getElementById("phase"), bar: document.getElementById("bar"),
  start: document.getElementById("startBtn"), reset: document.getElementById("resetBtn"), clock: document.getElementById("clock"),

};
// 回数入りのセリフ
const sayRound = lines => say(pick(lines).replace("{n}", cycle).replace("{max}", settings.repeat));

function renderPomo(){
  const isRest = phase !== "focus";
  el.time.textContent = fmt(pomo.left());
  el.phase.textContent = phase === "long" ? "ながいきゅうけい" : isRest ? "きゅうけい" : "しゅうちゅう";
  el.cycle.textContent = `${Math.min(cycle, settings.repeat)}/${settings.repeat}`;
  el.phase.classList.toggle("rest", isRest);
  el.bar.classList.toggle("rest", isRest);
  setBar(el.bar, pomo.progress());
  el.start.textContent = pomo.running ? "いちじ停止" : (pomo.left() < pomo.total ? "つづける" : "はじめる");
}

function pomoStart(){
  unlockAudio();
  const fresh = pomo.left() >= pomo.total;
  pomo.start();
  lastMidLine = Date.now();
  if (fresh){
    saidLast = false;
    if (phase === "focus"){
      if (getPeriod(new Date().getHours()) === "midnight" && Math.random() < .5) say(pick(LINES.midnightFocus));
      else if (cycle >= settings.repeat && settings.repeat > 1) sayRound(LINES.focusFinal);
      else if (cycle > 1) sayRound(LINES.focusRound);
      else say(pick(LINES.focusStart));
    }
    else if (phase === "long") sayRound(LINES.longStart);
    else say(pick(LINES.restStart));
  }
  updateWakeLock(); renderPomo();
}
function pomoPause(){ pomo.pause(); say(pick(LINES.paused)); updateWakeLock(); renderPomo(); }
function pomoReset(){
  phase = "focus"; cycle = 1; pomo.set(phaseTotal()); saidLast = false;
  say(pick(LINES.idle[getPeriod(new Date().getHours())]));
  updateWakeLock(); renderPomo();
}
function pomoFinish(){
  if (phase === "focus"){
    addCount(); chime("focus");
    // 決めた回数の集中が終わったら長い休憩、それ以外はふつうの休憩(どちらも自動でスタート)
    phase = cycle >= settings.repeat ? "long" : "rest"; pomo.set(phaseTotal());
    pomoStart();
  } else if (phase === "rest"){
    chime("rest");
    cycle++; phase = "focus"; pomo.set(phaseTotal());
    if (settings.autoNext) pomoStart();       // 自動オンなら次の集中もそのまま始める
    else { sayRound(LINES.restNext); updateWakeLock(); renderPomo(); }
  } else {
    // 長い休憩のあとは1回目に戻って止まる
    chime("rest");
    cycle = 1; phase = "focus"; pomo.set(phaseTotal());
    say(pick(LINES.longEnd));
    updateWakeLock(); renderPomo();
  }
}
const midLines = () => phase === "focus" ? LINES.focusMid : phase === "long" ? LINES.longMid : LINES.restMid;
function pomoTick(){
  if (pomo.finished()) return pomoFinish();
  if (!pomo.running) return;
  const r = pomo.left();
  // 途中のひとこと(約4分ごと)と、終わり1分前のひとこと
  if (phase === "focus" && !saidLast && r <= 60*1000 && pomo.total > 2*60*1000){ saidLast = true; say(pick(LINES.focusLast)); }
  else if (Date.now() - lastMidLine > 4*60*1000 && r > 60*1000){
    lastMidLine = Date.now();
    say(pick(midLines()));
  }
}

el.start.addEventListener("click", () => pomo.running ? pomoPause() : pomoStart());
el.reset.addEventListener("click", pomoReset);
document.getElementById("speech").addEventListener("click", () => {
  say(pomo.running ? pick(midLines()) : pick(LINES.idle[getPeriod(new Date().getHours())]));
});

  stopRing();
  kTimer.set(sec * 1000); kName = `⏱ ${fmtSec(sec)}`;
  markPreset("q" + i);
  kStart();
}

// プリセットを選ぶと、すぐにスタート(手早さ優先)
function kChoose(i){
  const p = KITCHEN_PRESETS[i];
  stopRing();
  kTimer.set(p.sec * 1000); kName = `${p.emo} ${p.name}${p.note ? "(" + p.note + ")" : ""}`;
  markPreset("p" + i);
  kStart();
}
function kStart(){
  unlockAudio();
  if (kTimer.left() <= 0){ kSay(pick(LINES.kPick)); return; }
  const fresh = kTimer.left() >= kTimer.total;
  kTimer.start(); kMidAt = Date.now();
  if (fresh){ kSaidLast = false; kSay(pick(kName && !kName.startsWith("⏱") ? LINES.kStart : LINES.qStart)); }
  updateWakeLock(); renderKitchen();
}
function kPause(){ kTimer.pause(); kSay(pick(LINES.kPaused)); updateWakeLock(); renderKitchen(); }
function kReset(){
  stopRing(); kTimer.set(0); kName = ""; markPreset(null);
  kSay(pick(LINES.kIdle)); updateWakeLock(); renderKitchen();
}
// +30秒/+1分:止まっているときは時間を足すだけ、ゆであがり後は延長してすぐ再スタート
function kAdd(sec){
  unlockAudio();
  if (ringing || (kTimer.left() <= 0 && kName)){
    stopRing();
    kTimer.set(sec * 1000);
    if (kName && !kName.includes("延長")) kName += "(延長)";
    kTimer.start(); kMidAt = Date.now(); kSaidLast = true;
    kSay(pick(LINES.kExtend));
  } else {
    kTimer.add(sec * 1000);
    if (!kTimer.running && !kName) markPreset(null);
  }
  updateWakeLock(); renderKitchen();
}
function kFinish(){
  kTimer.pause();
  ringing = true;
  // 料理のときは「ゆであがり」、すぐ計る・自分で設定のときは「時間だにゃ」
  const cooking = kName && !kName.startsWith("⏱");
  document.getElementById("kringBig").textContent = cooking ? "ゆであがったにゃ!" : "時間だにゃ!";
  k.ringSub.textContent = cooking ? `${kName} できたよ` : `${kName ? kName + " " : ""}おわったよ`;
  k.ring.classList.add("open");
  kSay(pick(LINES.kDone));
  kitchenAlarm();
  ringLoop = setInterval(kitchenAlarm, 1400);
  ringStop = setTimeout(stopRing, 90 * 1000);    // 鳴りっぱなしは90秒まで
  updateWakeLock(); renderKitchen();
}
function stopRing(){
  clearInterval(ringLoop); clearTimeout(ringStop);
  if (navigator.vibrate) navigator.vibrate(0);
  if (ringing){ ringing = false; k.ring.classList.remove("open"); updateWakeLock(); }
}
function kitchenTick(){
  if (kTimer.finished()) return kFinish();
  if (!kTimer.running) return;
  const r = kTimer.left();
  if (!kSaidLast && r <= 30*1000 && kTimer.total > 90*1000){ kSaidLast = true; kSay(pick(LINES.kLast)); }
  else if (Date.now() - kMidAt > 3*60*1000 && r > 30*1000){ kMidAt = Date.now(); kSay(pick(LINES.kMid)); }
}

k.start.addEventListener("click", () => kTimer.running ? kPause() : kStart());
document.getElementById("kReset").addEventListener("click", kReset);
document.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => kAdd(+b.dataset.add)));
document.getElementById("kStop").addEventListener("click", () => { stopRing(); renderKitchen(); });
document.getElementById("kSpeech").addEventListener("click", () => kSay(pick(kTimer.running ? LINES.kMid : LINES.kIdle)));

/* =========================================================
   モード切り替え(ポモドーロ=横 / キッチン=縦)
   ========================================================= */
let mode = store.get("mode", "pomodoro");
function setMode(m){
  mode = m; store.set("mode", m);
  document.body.classList.toggle("mode-kitchen", m === "kitchen");
  document.title = m === "kitchen" ? "猫キッチンタイマー" : "猫ポモドーロ";
  document.getElementById("rotateText").textContent = m === "kitchen" ? "スマホを縦にしてね" : "スマホを横にしてね";
  document.getElementById("rotateSwitch").textContent = m === "kitchen" ? "🍅 ポモドーロにもどる" : "🍳 キッチンモードにする";
  // ホーム画面から開いた全画面のときは、向きを自動で合わせる(できない環境では何もしない)
  try{ screen.orientation.lock(m === "kitchen" ? "portrait" : "landscape").catch(() => {}); }catch{}
}
document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
document.getElementById("rotateSwitch").addEventListener("click", () => setMode(mode === "kitchen" ? "pomodoro" : "kitchen"));

/* ===== 設定パネル ===== */
const sheet = document.getElementById("sheet");
const autoNextBtn = document.getElementById("autoNext");
autoNextBtn.addEventListener("click", () => { settings.autoNext = !settings.autoNext; store.set("settings", settings); renderSettings(); });
function renderSettings(){
  for (const key in LIMITS) document.getElementById(key + "Val").textContent = settings[key] + LIMITS[key][2];
  autoNextBtn.textContent = settings.autoNext ? "オン" : "オフ";
  autoNextBtn.classList.toggle("on", settings.autoNext);
  document.querySelectorAll("[data-clock]").forEach(b => b.classList.toggle("on", (b.dataset.clock === "24") === settings.clock24));
  document.querySelectorAll(".snd-list button").forEach(b => b.classList.toggle("on", settings[b.parentNode.dataset.snd] === b.dataset.v));
}
// 時刻の表示(24時間 / 12時間)
document.querySelectorAll("[data-clock]").forEach(b => b.addEventListener("click", () => {
  settings.clock24 = b.dataset.clock === "24"; store.set("settings", settings); renderSettings(); tick();
}));
// 音の選択ボタンを作る(ポモドーロには「なし」もある)
document.querySelectorAll(".snd-list").forEach(list => {
  const key = list.dataset.snd;
  const opts = (key === "pomoSound" ? [["off", "なし"]] : []).concat(Object.entries(SOUND_NAMES));
  opts.forEach(([v, label]) => {
    const b = document.createElement("button");
    b.dataset.v = v; b.textContent = label;
    b.addEventListener("click", () => {
      settings[key] = v; store.set("settings", settings); renderSettings();
      unlockAudio(); if (v !== "off") playSound(v);
    });
    list.appendChild(b);
  });
});
document.querySelectorAll("#settingsBtn,#kSettingsBtn").forEach(b => b.addEventListener("click", () => { renderSettings(); sheet.classList.add("open"); }));
document.getElementById("closeSheet").addEventListener("click", () => sheet.classList.remove("open"));
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.classList.remove("open"); });
document.querySelectorAll(".stepper button[data-k]").forEach(b => b.addEventListener("click", () => {
  const key = b.dataset.k, d = +b.dataset.d;
  const [min, max] = LIMITS[key];
  settings[key] = Math.min(max, Math.max(min, settings[key] + d));
  store.set("settings", settings); renderSettings();
  // 止まっているときは、今のフェーズに新しい時間をすぐ反映
  if (!pomo.running && key === PHASE_KEY[phase]){ pomo.set(phaseTotal()); renderPomo(); }
  if (key === "repeat") renderPomo();
}));
store.set("settings", settings);

/* ===== 毎0.5秒の更新(両方のタイマーは裏でも同時に進む) ===== */
function tick(){
  pomoTick(); kitchenTick();
  renderPomo(); renderKitchen();
  const now = new Date();
  const h = now.getHours(), mm = String(now.getMinutes()).padStart(2,"0");
  // 12時間表記は日本式に「午前0:48」「午後3:05」
  const hm = settings.clock24 ? `${String(h).padStart(2,"0")}:${mm}`
                              : `<small>${h < 12 ? "午前" : "午後"}</small>${h % 12}:${mm}`;
  if (el.clock.innerHTML !== hm){ el.clock.innerHTML = hm; document.getElementById("kClock").innerHTML = hm; }
  const ds = `${now.getMonth() + 1}月${now.getDate()}日(${"日月火水木金土"[now.getDay()]})`;
  const dEl = document.getElementById("date"); if (dEl.textContent !== ds) dEl.textContent = ds;
  setBackground(now.getHours(), getWeather());
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){ wakeLock = null; updateWakeLock(); tick(); }
});

/* ===== 起動 ===== */
setMode(mode);
renderCount();
say(pick(LINES.idle[getPeriod(new Date().getHours())]));
kSay(pick(LINES.kIdle));
tick();
setInterval(tick, 500);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
